services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: raghub
      POSTGRES_USER: raghub
      POSTGRES_PASSWORD: raghub
    ports: ["5432:5432"]
    volumes: ["raghub-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raghub -d raghub"]
      interval: 5s
      timeout: 5s
      retries: 10
    configs:
      - source: schema
        target: /docker-entrypoint-initdb.d/001_init.sql
      - source: seed
        target: /docker-entrypoint-initdb.d/002_demo_seed.sql
      - source: registration_migration
        target: /docker-entrypoint-initdb.d/003_registration_workflow.sql
      - source: department_approval
        target: /docker-entrypoint-initdb.d/004_department_approval.sql
      - source: document_summaries
        target: /docker-entrypoint-initdb.d/005_document_summaries.sql
      - source: developer_and_system
        target: /docker-entrypoint-initdb.d/008_developer_and_system.sql
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://raghub:raghub@db:5432/raghub
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_LLM_MODEL: ${GROQ_LLM_MODEL:-qwen/qwen3.8-27b}
      WEB_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  raghub-data:
configs:
  schema:
    file: ./apps/api/sql/001_init.sql
  seed:
    file: ./apps/api/sql/002_demo_seed.sql
  registration_migration:
    file: ./apps/api/sql/003_registration_workflow.sql
  department_approval:
    file: ./apps/api/sql/004_department_approval.sql
  document_summaries:
    file: ./apps/api/sql/005_document_summaries.sql
  developer_and_system:
    file: ./apps/api/sql/008_developer_and_system.sql

